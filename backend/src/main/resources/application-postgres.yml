spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/talentai
    username: ${DB_USERNAME:talentai}
    password: ${DB_PASSWORD:talentai}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
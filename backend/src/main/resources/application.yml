spring:
  application:
    name: talent-sourcing-agent

  datasource:
    url: jdbc:h2:file:./data/talentai;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: aneeckahsan@gmail.com
    password: ljgvkopjiaezbqvx
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    anthropic:
          api-key: ${CLAUDE_API_KEY:}
          chat:
            options:
              model: claude-sonnet-4-6
              max-tokens: 2048

server:
  port: 8080


app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  demo-mode: true   # skips email uniqueness check on candidate lookup
  demo-user-mailbox: ${DEMO_USER_MAILBOX:ahsanhabib19902021@gmail.com}   # demo users get me+<username>@gmail.com so their emails arrive here
  hr-notification-email: ${HR_NOTIFICATION_EMAIL:ahsanhabib19902021@gmail.com}
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-min-256-bits}
    expirationMs: 86400000
  sftp:
    port: ${SFTP_PORT:2222}
    username: ${SFTP_USERNAME:hr}
    password: ${SFTP_PASSWORD:change-me}
    host-key-path: ${SFTP_HOST_KEY_PATH:./data/sftp-hostkey.ser}
  cv-inbox:
    root-path: ${CV_INBOX_ROOT:./data/cv-inbox}